openapi: 3.1.0
info:
  title: SmartCourse API
  version: 0.1.0
  summary: Public API of the SmartCourse learning platform, served by the gateway.
  description: |
    All requests go through the gateway (the only published port). Except for the
    `auth` endpoints and `/ping`, every route requires `Authorization: Bearer <access_token>`.

    Access tokens are short-lived JWTs (15 min). Use `POST /auth/refresh` with the
    refresh token to get a new pair; each refresh token works once (rotation), and
    reusing an old one revokes that login session.

    Every response carries an `X-Request-ID` header. Clients may send their own
    (it must be a UUID, otherwise a new one is generated).

    Errors always have the shape `{"error": "<message>"}`.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000
    description: Local (task up)
tags:
  - name: auth
    description: Registration and sessions (public).
  - name: users
    description: User profiles (Identity service).
  - name: courses
    description: Course catalog (Catalog service).
  - name: system
    description: Liveness.
security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a student or instructor
      description: Admin accounts cannot self-register; they are created by an operator with `task admin:create`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange email and password for tokens
      description: Wrong password and unknown email return the same 401, so accounts can't be enumerated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Rotate a refresh token
      description: Returns a new access token and a new refresh token; the presented refresh token stops working.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200": { $ref: "#/components/responses/Tokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session a refresh token belongs to
      description: Idempotent; unknown or already revoked tokens also return 204.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204":
          description: Session ended.
        "400": { $ref: "#/components/responses/BadRequest" }

  /users/me:
    get:
      tags: [users]
      operationId: getCurrentUser
      summary: The caller's own profile
      responses:
        "200":
          description: The caller, including email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/{id}:
    get:
      tags: [users]
      operationId: getUser
      summary: A user's profile
      description: "`email` is included only when the caller is that user or an admin."
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /courses:
    post:
      tags: [courses]
      operationId: createCourse
      summary: Create a draft course (instructors only)
      description: The caller becomes the course's instructor.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCourseRequest" }
      responses:
        "201":
          description: Course created as a draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [courses]
      operationId: listCourses
      summary: List courses visible to the caller
      description: |
        Students see published courses; instructors also see their own courses in any
        status; admins see everything. Newest first.
      parameters:
        - name: instructor_id
          in: query
          description: Only courses of this instructor.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: A page of courses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /courses/{id}:
    parameters:
      - $ref: "#/components/parameters/CourseID"
    get:
      tags: [courses]
      operationId: getCourse
      summary: A course
      description: Courses the caller may not see return 404, so their existence isn't revealed.
      responses:
        "200":
          description: The course.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [courses]
      operationId: updateCourse
      summary: Update a course's title or description
      description: Only the course's instructor or an admin. Omitted fields are unchanged; an empty description clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCourseRequest" }
      responses:
        "200":
          description: The updated course.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Course" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /ping:
    get:
      tags: [system]
      operationId: ping
      summary: Gateway liveness
      security: []
      responses:
        "200":
          description: The gateway is up.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, const: pong }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /auth/login` or `POST /auth/refresh`.

  parameters:
    UserID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CourseID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Tokens:
      description: A new token pair. Not cacheable.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TokenPair" }
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid or expired credentials.
      headers:
        WWW-Authenticate:
          description: Set by the gateway when the access token is missing or invalid.
          schema: { type: string, examples: ['Bearer realm="smartcourse"'] }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but not allowed to do this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Does not exist, or is not visible to the caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with existing data (e.g. email already in use).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, examples: ["course not found"] }

    Role:
      type: string
      enum: [student, instructor, admin]

    User:
      type: object
      required: [id, name, role, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email:
          type: string
          format: email
          description: Present only for the user themselves or an admin.
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: 8 characters to 72 bytes (bcrypt's limit).
          writeOnly: true
        role:
          type: string
          enum: [student, instructor]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, writeOnly: true }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    TokenPair:
      type: object
      required: [access_token, token_type, expires_in, refresh_token]
      properties:
        access_token: { type: string, description: JWT (HS256). }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Access token lifetime in seconds., examples: [900] }
        refresh_token: { type: string, description: Opaque; valid for 7 days or until used once. }

    CourseStatus:
      type: string
      enum: [draft, published]

    Course:
      type: object
      required: [id, instructor_id, title, description, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        instructor_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/CourseStatus" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateCourseRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string }

    UpdateCourseRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string }

    CourseList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Course" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

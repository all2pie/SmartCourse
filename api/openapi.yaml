components:
  schemas:
    CourseListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/CourseResponse"
          type: array
        limit:
          format: int64
          type: integer
        offset:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - items
        - total
        - limit
        - offset
      type: object
    CourseResponse:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type: string
        id:
          format: uuid
          type: string
        instructor_id:
          format: uuid
          type: string
        status:
          enum:
            - draft
            - published
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - instructor_id
        - title
        - description
        - status
        - created_at
        - updated_at
      type: object
    CreateCourseRequest:
      additionalProperties: false
      properties:
        description:
          type: string
        title:
          maxLength: 255
          minLength: 1
          type: string
      required:
        - title
      type: object
    CreateLessonRequest:
      additionalProperties: false
      properties:
        body:
          maxLength: 100000
          type: string
        title:
          maxLength: 255
          minLength: 1
          type: string
        type:
          enum:
            - video
            - document
            - article
            - external_link
          type: string
        url:
          maxLength: 2048
          type: string
      required:
        - title
        - type
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    LessonResponse:
      additionalProperties: false
      properties:
        body:
          type: string
        id:
          format: uuid
          type: string
        title:
          type: string
        type:
          enum:
            - video
            - document
            - article
            - external_link
          type: string
        url:
          type: string
      required:
        - id
        - title
        - type
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        email:
          minLength: 1
          type: string
        password:
          minLength: 1
          type: string
          writeOnly: true
      required:
        - email
        - password
      type: object
    ModuleListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ModuleResponse"
          type: array
      required:
        - items
      type: object
    ModuleRequest:
      additionalProperties: false
      properties:
        title:
          maxLength: 255
          minLength: 1
          type: string
      required:
        - title
      type: object
    ModuleResponse:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        lessons:
          items:
            $ref: "#/components/schemas/LessonResponse"
          type: array
        title:
          type: string
      required:
        - id
        - title
        - lessons
      type: object
    PingOutputBody:
      additionalProperties: false
      properties:
        message:
          enum:
            - pong
          type: string
      required:
        - message
      type: object
    RefreshRequest:
      additionalProperties: false
      properties:
        refresh_token:
          minLength: 1
          type: string
      required:
        - refresh_token
      type: object
    RegisterRequest:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 255
          type: string
        name:
          maxLength: 255
          minLength: 1
          type: string
        password:
          description: 8 characters to 72 bytes (bcrypt's limit).
          maxLength: 72
          minLength: 8
          type: string
          writeOnly: true
        role:
          enum:
            - student
            - instructor
          type: string
      required:
        - name
        - email
        - password
        - role
      type: object
    ReorderLessonsRequest:
      additionalProperties: false
      properties:
        lesson_ids:
          description: Every lesson ID of the module, in the new order.
          items:
            format: uuid
            type: string
          maxItems: 100
          type: array
      required:
        - lesson_ids
      type: object
    ReorderModulesRequest:
      additionalProperties: false
      properties:
        module_ids:
          description: Every module ID of the course, in the new order.
          items:
            format: uuid
            type: string
          maxItems: 100
          type: array
      required:
        - module_ids
      type: object
    TokenResponse:
      additionalProperties: false
      properties:
        access_token:
          description: JWT (HS256).
          type: string
        expires_in:
          description: Access token lifetime in seconds.
          examples:
            - 900
          format: int64
          type: integer
        refresh_token:
          description: Opaque; valid for 7 days or until used once.
          type: string
        token_type:
          enum:
            - Bearer
          type: string
      required:
        - access_token
        - token_type
        - expires_in
        - refresh_token
      type: object
    UpdateCourseRequest:
      additionalProperties: false
      properties:
        description:
          type: string
        title:
          maxLength: 255
          minLength: 1
          type: string
      type: object
    UpdateLessonRequest:
      additionalProperties: false
      properties:
        body:
          maxLength: 100000
          type: string
        title:
          maxLength: 255
          minLength: 1
          type: string
        url:
          maxLength: 2048
          type: string
      type: object
    UserResponse:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        email:
          description: Present only for the user themselves or an admin.
          format: email
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        role:
          enum:
            - student
            - instructor
            - admin
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - name
        - role
        - created_at
        - updated_at
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Access token from `POST /auth/login` or `POST /auth/refresh`.
      scheme: bearer
      type: http
info:
  description: |
    Public API of the SmartCourse learning platform, served by the gateway.

    All requests go through the gateway (the only published port). Except for the
    `auth` endpoints and `/ping`, every route requires `Authorization: Bearer <access_token>`.

    Access tokens are short-lived JWTs (15 min). Use `POST /auth/refresh` with the
    refresh token to get a new pair; each refresh token works once (rotation), and
    reusing an old one revokes that login session.

    Every response carries an `X-Request-ID` header. Clients may send their own
    (it must be a UUID, otherwise a new one is generated).

    Errors are RFC 9457 problem details (`application/problem+json`). Malformed JSON is
    a 400; a well-formed request that fails validation is a 422 with the failing fields in `errors`.
  license:
    identifier: LicenseRef-Proprietary
    name: Proprietary
  title: SmartCourse API
  version: 0.2.0
openapi: 3.1.0
paths:
  /auth/login:
    post:
      description: Wrong password and unknown email return the same 401, so accounts can't be enumerated.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
          headers:
            Cache-Control:
              schema:
                enum:
                  - no-store
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: The owning service is unreachable.
      security: []
      summary: Exchange email and password for tokens
      tags:
        - auth
  /auth/logout:
    post:
      description: Idempotent; unknown or already revoked tokens also return 204.
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: The owning service is unreachable.
      security: []
      summary: End the session a refresh token belongs to
      tags:
        - auth
  /auth/refresh:
    post:
      description: Returns a new access token and a new refresh token; the presented refresh token stops working. Presenting an already rotated token revokes the whole session.
      operationId: refreshTokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
          headers:
            Cache-Control:
              schema:
                enum:
                  - no-store
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: The owning service is unreachable.
      security: []
      summary: Rotate a refresh token
      tags:
        - auth
  /auth/register:
    post:
      description: Admin accounts cannot self-register; they are created by an operator with `task admin:create`.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: The owning service is unreachable.
      security: []
      summary: Register a student or instructor
      tags:
        - auth
  /courses:
    get:
      description: Students see published courses; instructors also see their own courses in any status; admins see everything. Newest first.
      operationId: listCourses
      parameters:
        - description: Only courses of this instructor.
          explode: false
          in: query
          name: instructor_id
          schema:
            description: Only courses of this instructor.
            format: uuid
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 20
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            default: 0
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseListResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
          headers:
            WWW-Authenticate:
              description: Set by the gateway when the access token is missing or invalid.
              schema:
                examples:
                  - Bearer realm="smartcourse"
                type: string
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: The owning service is unreachable.
      security:
        - bearerAuth: []
      summary: List courses visible to the caller
      tags:
        - courses
    post:
      description: The caller becomes the course's instructor.
      operationId: createCourse
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourseRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
          headers:
            WWW-Authenticate:
              description: Set by the gateway when the access token is missing or invalid.
              schema:
                examples:
                  - Bearer realm="smartcourse"
                type: string
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: The owning service is unreachable.
      security:
        - bearerAuth: []
      summary: Create a draft course (instructors only)
      tags:
        - courses
  /courses/{id}:
    get:
      description: Instructors and admins see the working copy; students see the published version. Courses the caller may not see return 404, so their existence isn't revealed.
      operationId: getCourse
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
          headers:
            WWW-Authenticate:
              description: Set by the gateway when the access token is missing or invalid.
              schema:
                examples:
                  - Bearer realm="smartcourse"
                type: string
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: The owning service is unreachable.
      security:
        - bearerAuth: []
      summary: A course
      tags:
        - courses
    patch:
      description: Only the course's instructor or an admin. Changes go to the course's working copy and are not visible to students until the course is published. Omitted fields are unchanged; an empty description clears it; at least one field is required.
      operationId: updateCourse
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCourseRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
          headers:
            WWW-Authenticate:
              description: Set by the gateway when the access token is missing or invalid.
              schema:
                examples:
                  - Bearer realm="smartcourse"
                type: string
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: The owning service is unreachable.
      security:
        - bearerAuth: []
      summary: Update a course's title or description
      tags:
        - courses
  /courses/{id}/modules:
    get:
      description: Instructors and admins see the working copy; students see the published content.
      operationId: listModules
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleListResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
          headers:
            WWW-Authenticate:
              description: Set by the gateway when the access token is missing or invalid.
              schema:
                examples:
                  - Bearer realm="smartcourse"
                type: string
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: The owning service is unreachable.
      security:
        - bearerAuth: []
      summary: A course's modules and lessons, in order
      tags:
        - content
    post:
      description: Only the course's instructor or an admin. Changes go to the course's working copy and are not visible to students until the course is published.
      operationId: createModule
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleResponse"
          description: Created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
          headers:
            WWW-Authenticate:
              description: Set by the gateway when the access token is missing or invalid.
              schema:
                examples:
                  - Bearer realm="smartcourse"
                type: string
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "502":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: The owning service is unreachable.
      security:
        - bearerAuth: []
      summary: Add a module at the end of the course
      tags:
        - content
  /courses/{id}/modules/order:
    put:
      description: Only the course's instructor or an admin. Changes go to the course's working copy and are not visible to students until the course is published. The list must contain every module ID exactly once.
      operationId: reorderModules
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderModulesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleListResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
          headers:
            WWW-Authenticate:
              description: Set by the gateway when the access token is missing or invalid.
              schema:
                examples:
                  - Bearer realm="smartcourse"
                type: string
        "403":
          content:
            application/problem+json:
              schema:

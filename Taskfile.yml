version: "3"

vars:
  BINARY: bin/api
  MIGRATIONS_PATH: db/migrations
  DATABASE_URL: postgres://{{.DB_USER}}:{{.DB_PASSWORD}}@{{.DB_HOST}}:{{.DB_PORT}}/{{.DB_NAME}}?sslmode=disable

dotenv: [".env"]

tasks:
  migrate:up:
    desc: Apply all up migrations
    cmds:
      - migrate -path {{.MIGRATIONS_PATH}} -database "{{.DATABASE_URL}}" up

  migrate:down:
    desc: Roll back the last migration
    cmds:
      - migrate -path {{.MIGRATIONS_PATH}} -database "{{.DATABASE_URL}}" down 1

  migrate:create:
    desc: 'Create a new migration pair (usage: task migrate:create -- add_courses_table)'
    cmds:
      - migrate create -ext sql -dir {{.MIGRATIONS_PATH}} -seq {{.CLI_ARGS}}

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  fmt:
    desc: Format code
    cmds:
      - golangci-lint fmt

  lint:
    desc: Run linters
    cmds:
      - golangci-lint run

  check:
    desc: Format + lint (run before every commit)
    deps: [fmt, lint]

  build:
    desc: Build the API binary
    cmds:
      - go build -o {{.BINARY}} ./cmd/api

  run:
    desc: Run the API
    cmds:
      - go run ./cmd/api

  test:
    desc: Run tests
    cmds:
      - go test ./... -v
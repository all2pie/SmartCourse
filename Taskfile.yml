version: "3"

vars:
  # Migrations live in migrations/<SERVICE>; each service's database is named after it.
  # SERVICE is only appended inside tasks: global vars are rendered before CLI vars exist.
  PG_URL: postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@localhost:{{.POSTGRES_PORT}}
  MONGO_URL: mongodb://localhost:{{.MONGO_PORT}}
  # Services whose database is MongoDB (space-separated); every other service uses Postgres.
  MONGO_SERVICES: catalog

dotenv: [".env"]

tasks:
  infra:up:
    desc: Start local infra via Docker Compose
    cmds:
      - docker compose up -d --wait

  infra:down:
    desc: Stop local infra started via Docker Compose
    cmds:
      - docker compose down

  migrate:up:
    desc: 'Apply all up migrations (usage: task migrate:up SERVICE=identity)'
    requires:
      vars: [SERVICE]
    cmds:
      - task: migrate:run
        vars: { SERVICE: "{{.SERVICE}}", ARGS: up }

  migrate:down:
    desc: 'Roll back the last migration (usage: task migrate:down SERVICE=identity)'
    requires:
      vars: [SERVICE]
    cmds:
      - task: migrate:run
        vars: { SERVICE: "{{.SERVICE}}", ARGS: down 1 }

  migrate:create:
    desc: 'Create a new migration pair (usage: task migrate:create SERVICE=identity -- add_password_hash)'
    requires:
      vars: [SERVICE]
    vars:
      EXT: '{{if has .SERVICE (splitList " " .MONGO_SERVICES)}}json{{else}}sql{{end}}'
    cmds:
      - migrate create -ext {{.EXT}} -dir migrations/{{.SERVICE}} -seq {{.CLI_ARGS}}

  migrate:run:
    internal: true
    vars:
      DB_URL: '{{if has .SERVICE (splitList " " .MONGO_SERVICES)}}{{.MONGO_URL}}/{{.SERVICE}}?directConnection=true{{else}}{{.PG_URL}}/{{.SERVICE}}?sslmode=disable{{end}}'
    cmds:
      - migrate -path migrations/{{.SERVICE}} -database "{{.DB_URL}}" {{.ARGS}}

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  fmt:
    desc: Format code
    cmds:
      - golangci-lint fmt

  lint:
    desc: Run linters
    cmds:
      - golangci-lint run

  check:
    desc: Format + lint (run before every commit)
    deps: [fmt, lint]

  build:
    desc: Build every service binary into bin/
    cmds:
      - go build -o bin/ ./cmd/...

  run:
    desc: 'Run one service (usage: task run SERVICE=identity)'
    requires:
      vars: [SERVICE]
    cmds:
      - go run ./cmd/{{.SERVICE}}

  test:
    desc: Run tests
    cmds:
      - go test ./... -v
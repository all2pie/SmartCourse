version: "3"

vars:
  # Migrations live in migrations/<SERVICE>; each service's database is named after it.
  # SERVICE is only appended inside tasks: global vars are rendered before CLI vars exist.
  PG_URL: postgres://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@localhost:{{.POSTGRES_PORT}}
  MONGO_URL: mongodb://localhost:{{.MONGO_PORT}}
  # Services whose database is MongoDB (space-separated); every other service uses Postgres.
  MONGO_SERVICES: catalog

dotenv: [".env"]

tasks:
  infra:up:
    desc: Start only the infra containers (Postgres, Mongo, Redis); run services on the host with `task run`
    cmds:
      - docker compose up -d --wait

  infra:down:
    desc: Stop the infra containers
    cmds:
      - docker compose down

  up:
    desc: Build and start everything in Docker (infra, migrations, services); gateway on :8000
    cmds:
      - docker compose --profile app up -d --build --wait

  down:
    desc: Stop everything started by `task up`
    cmds:
      - docker compose --profile app down

  logs:
    desc: 'Follow container logs (usage: task logs -- gateway identity)'
    cmds:
      - docker compose --profile app logs -f {{.CLI_ARGS}}

  migrate:up:
    desc: 'Apply all up migrations (usage: task migrate:up SERVICE=identity)'
    requires:
      vars: [SERVICE]
    cmds:
      - task: migrate:run
        vars: { SERVICE: "{{.SERVICE}}", ARGS: up }

  migrate:down:
    desc: 'Roll back the last migration (usage: task migrate:down SERVICE=identity)'
    requires:
      vars: [SERVICE]
    cmds:
      - task: migrate:run
        vars: { SERVICE: "{{.SERVICE}}", ARGS: down 1 }

  migrate:create:
    desc: 'Create a new migration pair (usage: task migrate:create SERVICE=identity -- add_password_hash)'
    requires:
      vars: [SERVICE]
    vars:
      EXT: '{{if has .SERVICE (splitList " " .MONGO_SERVICES)}}json{{else}}sql{{end}}'
    cmds:
      - migrate create -ext {{.EXT}} -dir migrations/{{.SERVICE}} -seq {{.CLI_ARGS}}

  migrate:run:
    internal: true
    vars:
      DB_URL: '{{if has .SERVICE (splitList " " .MONGO_SERVICES)}}{{.MONGO_URL}}/{{.SERVICE}}?directConnection=true{{else}}{{.PG_URL}}/{{.SERVICE}}?sslmode=disable{{end}}'
    cmds:
      - migrate -path migrations/{{.SERVICE}} -database "{{.DB_URL}}" {{.ARGS}}

  admin:create:
    desc: 'Create an admin account; prompts for the password (usage: task admin:create -- -email admin@example.com -name "Site Admin")'
    interactive: true
    cmds:
      - go run ./cmd/identity-admin {{.CLI_ARGS}}

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  fmt:
    desc: Format code
    cmds:
      - golangci-lint fmt

  lint:
    desc: Run linters
    cmds:
      - golangci-lint run

  check:
    desc: Format + lint (run before every commit)
    deps: [fmt, lint]

  api:gen:
    desc: Regenerate api/openapi.yaml from the services' Huma operations
    cmds:
      - go run ./cmd/openapi -o api/openapi.yaml

  api:lint:
    desc: Lint the OpenAPI contract (api/openapi.yaml)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}/api:/spec:ro" redocly/cli:2.65.1 lint --config /spec/redocly.yaml /spec/openapi.yaml

  api:check:
    desc: Fail if api/openapi.yaml is stale or fails lint
    cmds:
      - task: api:gen
      - git diff --exit-code api/openapi.yaml
      - task: api:lint

  docs:update:
    desc: 'Vendor a Swagger UI release into the gateway (usage: task docs:update VERSION=5.34.0)'
    requires:
      vars: [VERSION]
    vars:
      DIR: internal/gateway/swaggerui
      TGZ: /tmp/swagger-ui-dist-{{.VERSION}}.tgz
    cmds:
      - curl -fsSL -o {{.TGZ}} https://registry.npmjs.org/swagger-ui-dist/-/swagger-ui-dist-{{.VERSION}}.tgz
      # Refuse a tarball that doesn't match the integrity hash npm published for this version.
      - test "$(curl -fsSL https://registry.npmjs.org/swagger-ui-dist/{{.VERSION}} | jq -r .dist.integrity)" = "sha512-$(openssl dgst -sha512 -binary {{.TGZ}} | base64 -w0)"
      - mkdir -p {{.DIR}}
      - tar -xzf {{.TGZ}} -C {{.DIR}} --strip-components=1 package/swagger-ui-bundle.js package/swagger-ui.css package/swagger-ui-bundle.js.LICENSE.txt package/LICENSE package/NOTICE
      - echo {{.VERSION}} > {{.DIR}}/VERSION
      - rm {{.TGZ}}

  build:
    desc: Build every service binary into bin/
    cmds:
      - go build -o bin/ ./cmd/...

  run:
    desc: 'Run one service (usage: task run SERVICE=identity)'
    requires:
      vars: [SERVICE]
    cmds:
      - go run ./cmd/{{.SERVICE}}

  test:
    desc: Unit tests with the race detector (no external dependencies)
    cmds:
      - go test -race ./...

  test:integration:
    desc: Repository and token-store tests against real Postgres, MongoDB and Redis (testcontainers; needs Docker)
    cmds:
      - go test -race -tags integration ./internal/...

  test:e2e:
    desc: End-to-end + contract tests against the running stack (run `task up` first)
    cmds:
      - go test -count=1 -tags e2e ./test/e2e/... {{.CLI_ARGS}}
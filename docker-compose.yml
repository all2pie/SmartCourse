services:
  postgres:
    image: postgres:16-alpine
    container_name: smartcourse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8
    container_name: smartcourse-mongo
    restart: unless-stopped
    # Single-node replica set: Mongo transactions require one.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    environment:
      # Kernels >= 6.19 refuse to start Mongo 8 without this (SERVER-121912 / SERVER-125742).
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo:/data/db
    healthcheck:
      # Initiates the replica set on first run; healthy once this node is the writable primary.
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)",
        ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

volumes:
  postgres:
  mongo:
